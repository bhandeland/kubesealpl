image: perl:5.38

stages:
  - test
  - security
  - build
  - publish

variables:
  PERL_CPANM_OPT: "--quiet --notest"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - local/

before_script:
  - cpanm -l local App::cpanminus
  - cpanm -l local Dist::Zilla
  - export PERL5LIB="$PWD/local/lib/perl5:$PERL5LIB"
  - export PATH="$PWD/local/bin:$PATH"
  - dzil authordeps --missing | cpanm -l local
  - dzil listdeps --missing | cpanm -l local

# ------------------------------------------------------------------------------
# Test Stage
# ------------------------------------------------------------------------------
test:
  stage: test
  script:
    - dzil test --verbose
  coverage: '/^Total\s+.+\s+(\d+\.\d+)%$/'
  artifacts:
    reports:
      junit: test-results.xml
    when: always

test:perl-5.26:
  stage: test
  image: perl:5.26
  script:
    - dzil test

test:perl-5.32:
  stage: test
  image: perl:5.32
  script:
    - dzil test

# ------------------------------------------------------------------------------
# Security Stage
# ------------------------------------------------------------------------------
dependency_scan:
  stage: security
  script:
    - cpanm App::cpanoutdated CPAN::Audit
    - cpan-outdated -l local || true
    - cpan-audit installed 2>&1 | tee cpan-audit-report.txt
    - |
      if grep -q "found [1-9]" cpan-audit-report.txt; then
        echo "WARNING: Security vulnerabilities found in dependencies"
      fi
  artifacts:
    paths:
      - cpan-audit-report.txt
    when: always
  allow_failure: true

sast:
  stage: security
  script:
    - cpanm Perl::Critic Perl::Critic::Bangs Perl::Critic::Security
    - perlcritic --severity 4 --theme security lib/ || true
    - perlcritic --profile .perlcriticrc lib/ > perlcritic-report.txt 2>&1 || true
  artifacts:
    paths:
      - perlcritic-report.txt
    when: always
  allow_failure: true

# GitLab's built-in SAST (if you have GitLab Ultimate)
include:
  - template: Security/SAST.gitlab-ci.yml

# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------
build:
  stage: build
  script:
    - dzil build
  artifacts:
    paths:
      - "KubeSeal-*.tar.gz"
    expire_in: 1 week
  only:
    - main
    - tags

# ------------------------------------------------------------------------------
# Release Stage
# ------------------------------------------------------------------------------
generate_release_notes:
  stage: publish
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl jq
  script:
    # Get previous tag
    - |
      PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
      CURRENT_TAG=${CI_COMMIT_TAG}
      echo "Generating notes from ${PREV_TAG:-beginning} to ${CURRENT_TAG}"

    # Method 1: Extract from Changes file (Perl standard)
    - |
      if [ -f "Changes" ]; then
        echo "## Changes" > release_notes.md
        # Extract section for current version
        sed -n "/^${CURRENT_TAG#v}/,/^[0-9]/p" Changes | head -n -1 >> release_notes.md || true
      fi

    # Method 2: Generate from git commits
    - |
      echo "" >> release_notes.md
      echo "## Commits" >> release_notes.md
      if [ -n "$PREV_TAG" ]; then
        git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> release_notes.md
      else
        git log --pretty=format:"- %s (%h)" >> release_notes.md
      fi

    # Method 3: Categorize by conventional commits
    - |
      echo "" >> release_notes.md
      echo "" >> release_notes.md
      echo "## Summary" >> release_notes.md

      if [ -n "$PREV_TAG" ]; then
        RANGE="${PREV_TAG}..HEAD"
      else
        RANGE="HEAD"
      fi

      # Features
      FEATURES=$(git log $RANGE --pretty=format:"%s" | grep -E "^feat(\(.+\))?:" | sed 's/^feat[^:]*: /- /' || true)
      if [ -n "$FEATURES" ]; then
        echo "### Features" >> release_notes.md
        echo "$FEATURES" >> release_notes.md
      fi

      # Bug fixes
      FIXES=$(git log $RANGE --pretty=format:"%s" | grep -E "^fix(\(.+\))?:" | sed 's/^fix[^:]*: /- /' || true)
      if [ -n "$FIXES" ]; then
        echo "### Bug Fixes" >> release_notes.md
        echo "$FIXES" >> release_notes.md
      fi

      # Breaking changes
      BREAKING=$(git log $RANGE --pretty=format:"%s" | grep -E "^.+!:" | sed 's/^[^:]*: /- /' || true)
      if [ -n "$BREAKING" ]; then
        echo "### Breaking Changes" >> release_notes.md
        echo "$BREAKING" >> release_notes.md
      fi

    - cat release_notes.md
  artifacts:
    paths:
      - release_notes.md
    expire_in: 1 week
  only:
    - tags

create_gitlab_release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: generate_release_notes
      artifacts: true
    - job: build
      artifacts: true
  before_script: []
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "Release ${CI_COMMIT_TAG}"
    description: "./release_notes.md"
    assets:
      links:
        - name: "KubeSeal-${CI_COMMIT_TAG#v}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/KubeSeal-${CI_COMMIT_TAG#v}.tar.gz"
          link_type: package
  only:
    - tags

# ------------------------------------------------------------------------------
# Publish Stage
# ------------------------------------------------------------------------------
publish_cpan:
  stage: publish
  script:
    - cpanm CPAN::Uploader
    - |
      cat > ~/.pause << EOF
      user $PAUSE_USERNAME
      password $PAUSE_PASSWORD
      EOF
    - chmod 600 ~/.pause
    - dzil build
    - cpan-upload KubeSeal-*.tar.gz
  only:
    - tags
  when: manual
  environment:
    name: cpan
    url: https://metacpan.org/dist/KubeSeal

# Optional: Publish to a private CPAN mirror
publish_private:
  stage: publish
  script:
    - dzil build
    - |
      curl --fail --user "${PRIVATE_CPAN_USER}:${PRIVATE_CPAN_PASS}" \
           --upload-file KubeSeal-*.tar.gz \
           "${PRIVATE_CPAN_URL}/upload/"
  only:
    - main
  when: manual
  environment:
    name: private-cpan
