name    = KubeSeal
author  = Brandon Handeland <cpan@unbuffered.net>
license = MIT
copyright_holder = Brandon
copyright_year   = 2026

[@Basic]

[AutoPrereqs]
skip = ^KubeSeal

[MetaJSON]
[MetaYAML]

[PodWeaver]

[Test::Compile]
[Test::ReportPrereqs]

[Prereqs]
perl = 5.026
Moo = 2.005
Type::Tiny = 2.000
Types::Standard = 0
CryptX = 0.080
Crypt::OpenSSL::X509 = 1.915
YAML::XS = 0.88
Try::Tiny = 0.31
Throwable = 1.001
IO::Socket::SSL = 2.084
Mozilla::CA = 0
namespace::autoclean = 0.29

[Prereqs / TestRequires]
Test2::V0 = 0
Test::Exception = 0
Test::Deep = 0

[MetaProvides::Package]

[MetaResources]
homepage = https://github.com/brandon/perl-kubeseal
repository.url = https://github.com/brandon/perl-kubeseal.git
repository.type = git
repository.web = https://github.com/brandon/perl-kubeseal

[MinimumPerl]

[GatherDir]
[PruneCruft]
[ManifestSkip]
[MetaConfig]
[License]
[Readme]
[ExtraTests]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
